<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Retail Therapy</title>
  <meta name="robots" content="noindex, nofollow">
  <script>
    // Pick Day or Night before the first paint so there is no flash. Default: follow the device setting.
    (function () {
      var m = "system";
      try { m = localStorage.getItem("rt-theme") || "system"; } catch (e) {}
      var dark = m === "dark" || (m !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/ads.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#e8455a">
</head>
<body class="admin-page">
  <div class="sky" aria-hidden="true"><i></i></div>
  <header class="bar">
    <div class="bar-in">
      <a class="logo" href="/"><img class="logo-mark" src="/favicon.svg" alt="" width="30" height="30"><span data-site-name></span></a>
      <span class="grow"></span>
      <div class="theme" data-theme-toggle role="group" aria-label="Color theme"></div>
      <div class="acct" data-account hidden></div>
    </div>
  </header>

  <main class="admin" id="admin" aria-live="polite"><p class="empty">Loading&hellip;</p></main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/shared/theme.js"></script>
  <script src="/shared/app.js"></script>
  <script src="/shared/wish.js"></script>
  <script src="/shared/account.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
