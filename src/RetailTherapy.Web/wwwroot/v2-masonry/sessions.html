<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Therapy Sessions | RetailTherapy.com</title>
  <script>
    // Pick Day or Night before the first paint so there is no flash. Default: follow the device setting.
    (function () {
      var m = "system";
      try { m = localStorage.getItem("rt-theme") || "system"; } catch (e) {}
      var dark = m === "dark" || (m !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/ads.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#e8455a">
</head>
<body class="sessions-page">
  <div class="sky" aria-hidden="true"><i></i></div>
  <header class="bar">
    <div class="bar-in">
      <a class="logo" href="/"><img class="logo-mark" src="/favicon.svg" alt="" width="30" height="30"><span data-site-name></span></a>
      <span class="grow"></span>
      <a class="saved" href="/#saved" data-saved-btn aria-label="Saved items" title="Your saved finds">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.2l-1.5-1.3C5.3 15.3 2 12.3 2 8.6 2 5.6 4.4 3.2 7.4 3.2c1.7 0 3.4.8 4.6 2.1 1.2-1.3 2.9-2.1 4.6-2.1 3 0 5.4 2.4 5.4 5.4 0 3.7-3.3 6.7-8.5 11.3L12 21.2z"/></svg>
        <span class="n" data-saved-count hidden>0</span>
      </a>
      <div class="theme" data-theme-toggle role="group" aria-label="Color theme"></div>
      <div class="acct" data-account hidden></div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Sessions"></div>
    <p class="disc" data-disclosure></p>
  </header>

  <main class="sessions">
    <section class="intro">
      <h1><span aria-hidden="true">&#10022;</span> <span data-lists-name>Therapy Sessions</span></h1>
      <p data-lists-tagline>Hand-picked shelves, one mood at a time.</p>
    </section>
    <div id="sessions" aria-live="polite"></div>
  </main>

  <div class="ad-inline"><div class="ad-slot" data-ad="inline"></div></div>

  <footer class="foot">
    <p data-disclosure></p>
    <p><a href="/legal.html">Disclosure &amp; Privacy</a> &middot; &copy; <span data-year></span> <span data-site-name></span></p>
  </footer>

  <script src="/shared/theme.js"></script>
  <script src="/shared/app.js"></script>
  <script src="/shared/wish.js"></script>
  <script src="/shared/account.js"></script>
  <script src="sessions.js"></script>
</body>
</html>
